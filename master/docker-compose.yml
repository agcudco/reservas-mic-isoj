version: "3.8"

services:
  postgres:
    image: postgres:17-alpine               # Última versión estable LTS (17)
    container_name: postgres-general
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      # Variables genéricas. Si no se define POSTGRES_DB,
      # se crea automáticamente una base con el nombre del usuario (postgres).
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      # POSTGRES_DB:  # Eliminada para que no haya una base específica
    volumes:
      # Directorio de datos (persistencia real en el host)
      - ./postgres-data:/var/lib/postgresql/data
      # (Opcional) Directorio para ficheros de configuración personalizados
      # - ./postgres-config:/etc/postgresql/conf.d
      # (Opcional) Directorio para scripts de inicialización (solo se ejecutan si la BD está vacía)
      # - ./init-scripts:/docker-entrypoint-initdb.d