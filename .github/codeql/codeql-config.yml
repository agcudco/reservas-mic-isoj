# Consultas adicionales
queries:
  - uses: security-extended
  - uses: security-and-quality

# Excluir paths del análisis
paths-ignore:
  - '**/node_modules/**'
  - '**/dist/**'
  - '**/build/**'
  - '**/*.test.js'
  - '**/*.spec.js'
  - 'tests/**'

# Escanear solo archivos nuevos/modificados en PRs (más rápido)
paths:
  - src