name: CodeQL Security Analysis

on:
  push:
    branches: [main, develop, master]
  pull_request:
    branches: [main, develop, master]
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript
            build-mode: none
          - language: java
            build-mode: manual

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        if: matrix.language == 'java'
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven packages
        if: matrix.language == 'java'
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('master/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Set up Node.js
        if: matrix.language == 'javascript'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node dependencies
        if: matrix.language == 'javascript'
        run: |
          for dir in dashboard eventos reservas; do
            if [ -f "$dir/package.json" ]; then
              echo "Installing $dir..."
              (cd "$dir" && npm ci)
            fi
          done

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config: |
            paths-ignore:
              - '**/node_modules/**'
              - '**/dist/**'
              - '**/build/**'
              - '**/.angular/**'
              - 'master/target/**'

      - name: Build Java
        if: matrix.language == 'java' && matrix.build-mode == 'manual'
        working-directory: ./master
        run: |
          if [ -f "mvnw" ]; then
            chmod +x mvnw
            ./mvnw clean package -DskipTests
          elif command -v mvn &> /dev/null; then
            mvn clean package -DskipTests
          else
            echo "❌ No se encontró Maven ni mvnw"
            exit 1
          fi

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"

      # ============================================================
      # PASO CLAVE: Guardar resultados para el workflow de reporte
      # ============================================================
      - name: Exportar resultados para reporte
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
          LANGUAGE: ${{ matrix.language }}
        run: |
          echo "⏳ Consultando alerts de $LANGUAGE..."
          sleep 25

          MAX_RETRIES=10
          RETRY=0
          ALERTS_JSON=""

          while [ $RETRY -lt $MAX_RETRIES ]; do
            RESPONSE=$(curl -s -H "Authorization: token $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/code-scanning/alerts?ref=$REF&state=open&per_page=100")

            if echo "$RESPONSE" | jq -e 'type == "array"' > /dev/null 2>&1; then
              ALERTS_JSON="$RESPONSE"
              break
            fi
            sleep 10
            RETRY=$((RETRY+1))
          done

          mkdir -p codeql-outputs
          OUTPUT_FILE="codeql-outputs/${LANGUAGE}-results.json"

          if [ -n "$ALERTS_JSON" ]; then
            # Filtrar solo del lenguaje actual
            echo "$ALERTS_JSON" | jq --arg lang "$LANGUAGE" '
              {
                language: $lang,
                total_all: length,
                alerts: [.[] | select(.tool.name | ascii_downcase | contains($lang))] | map({
                  number: .number,
                  severity: (.rule.severity // "unknown"),
                  rule_id: .rule.id,
                  description: .rule.description,
                  path: .most_recent_instance.location.path,
                  start_line: .most_recent_instance.location.start_line,
                  url: .html_url
                })
              }
            ' > "$OUTPUT_FILE"
          else
            echo '{"language":"'$LANGUAGE'","total_all":0,"alerts":[]}' > "$OUTPUT_FILE"
          fi

          cat "$OUTPUT_FILE"

      - name: Subir artifact de resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codeql-raw-results-${{ matrix.language }}
          path: codeql-outputs/${{ matrix.language }}-results.json
          retention-days: 5