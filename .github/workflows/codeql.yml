name: CodeQL Security Analysis

on:
  push:
    branches: [main, develop, master]
  pull_request:
    branches: [main, develop, master]
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript
            build-mode: none
          - language: java
            build-mode: manual

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --- Java Setup (Spring Boot en master/) ---
      - name: Set up JDK 21
        if: matrix.language == 'java'
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven packages
        if: matrix.language == 'java'
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('master/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      # --- Node Setup (NestJS en eventos/, reservas/, dashboard/) ---
      - name: Set up Node.js
        if: matrix.language == 'javascript'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node dependencies
        if: matrix.language == 'javascript'
        run: |
          for dir in dashboard eventos reservas; do
            if [ -f "$dir/package.json" ]; then
              echo "Installing $dir..."
              (cd "$dir" && npm ci)
            fi
          done

      # --- Inicializar CodeQL v4 ---
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config: |
            paths-ignore:
              - '**/node_modules/**'
              - '**/dist/**'
              - '**/build/**'
              - '**/.angular/**'
              - 'master/target/**'

      # --- Build manual Java (en master/) ---
      - name: Build Java (Maven)
        if: matrix.language == 'java' && matrix.build-mode == 'manual'
        working-directory: ./master
        run: |
          chmod +x mvnw
          ./mvnw clean package -DskipTests

      # --- Análisis CodeQL ---
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"