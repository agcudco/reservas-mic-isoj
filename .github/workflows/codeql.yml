name: CodeQL Security Analysis

on:
  push:
    branches: [main, develop, master]
  pull_request:
    branches: [main, develop, master]
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
      pull-requests: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript
            build-mode: none
          - language: java
            build-mode: manual

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --- Java Setup (Spring Boot en master/) ---
      - name: Set up JDK 21
        if: matrix.language == 'java'
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven packages
        if: matrix.language == 'java'
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('master/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      # --- Node Setup (NestJS en eventos/, reservas/, dashboard/) ---
      - name: Set up Node.js
        if: matrix.language == 'javascript'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node dependencies
        if: matrix.language == 'javascript'
        run: |
          for dir in dashboard eventos reservas; do
            if [ -f "$dir/package.json" ]; then
              echo "Installing $dir..."
              (cd "$dir" && npm ci)
            fi
          done

      # --- Inicializar CodeQL v4 ---
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config: |
            paths-ignore:
              - '**/node_modules/**'
              - '**/dist/**'
              - '**/build/**'
              - '**/.angular/**'
              - 'master/target/**'

      # --- Build manual Java (detecta mvnw o usa mvn) ---
      - name: Build Java
        if: matrix.language == 'java' && matrix.build-mode == 'manual'
        working-directory: ./master
        run: |
          if [ -f "mvnw" ]; then
            echo "Usando Maven Wrapper..."
            chmod +x mvnw
            ./mvnw clean package -DskipTests
          elif command -v mvn &> /dev/null; then
            echo "Usando Maven instalado..."
            mvn clean package -DskipTests
          else
            echo "❌ No se encontró Maven ni mvnw en master/"
            exit 1
          fi

      # --- Análisis CodeQL ---
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"

      # --- Verificar vulnerabilidades, mostrar tabla y bloquear ---
      - name: Check for vulnerabilities
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "⏳ Consultando resultados de CodeQL..."
          sleep 30

          REF="${{ github.ref }}"
          REPO="${{ github.repository }}"
          LANGUAGE="${{ matrix.language }}"
          MAX_RETRIES=15
          RETRY=0
          ALERTS_JSON=""

          while [ $RETRY -lt $MAX_RETRIES ]; do
            RESPONSE=$(curl -s -H "Authorization: token $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/code-scanning/alerts?ref=$REF&state=open&per_page=100")

            if echo "$RESPONSE" | jq -e 'type == "array"' > /dev/null 2>&1; then
              ALERTS_JSON="$RESPONSE"
              break
            fi

            echo "   Reintento $((RETRY+1))/$MAX_RETRIES..."
            sleep 10
            RETRY=$((RETRY+1))
          done

          if [ -z "$ALERTS_JSON" ]; then
            echo "⚠️ No se pudieron obtener resultados de la API. Revisa manualmente en Security → Code scanning."
            exit 0
          fi

          TOTAL_COUNT=$(echo "$ALERTS_JSON" | jq 'length')

          # Filtrar por lenguaje (comparando con tool.name)
          FILTERED=$(echo "$ALERTS_JSON" | jq --raw-output --arg lang "$LANGUAGE" '
            [.[] | select(.tool.name | ascii_downcase | contains($lang))]
          ')
          LANG_COUNT=$(echo "$FILTERED" | jq 'length')

          echo ""
          echo "╔════════════════════════════════════════════════════════════════════╗"
          echo "║        RESULTADOS CODEQL - ${LANGUAGE^^}                                      ║"
          echo "╚════════════════════════════════════════════════════════════════════╝"
          echo ""
          echo "📊 Resumen:"
          echo "   • Total alerts abiertos en ref '$REF': $TOTAL_COUNT"
          echo "   • Alerts del lenguaje '$LANGUAGE': $LANG_COUNT"
          echo ""

          if [ "$LANG_COUNT" -gt 0 ]; then
            echo "| Severidad | Regla | Descripción | Archivo | Línea |"
            echo "|-----------|-------|-------------|---------|-------|"

            echo "$FILTERED" | jq -r '
              .[] |
              "| \(.rule.severity // "N/A" | ascii_upcase) | \(.rule.id // "N/A") | \(.rule.description // "N/A") | \(.most_recent_instance.location.path // "N/A") | \(.most_recent_instance.location.start_line // "N/A") |"
            '

            echo ""
            echo "❌ SE ENCONTRARON $LANG_COUNT VULNERABILIDAD(ES) EN ${LANGUAGE^^}"
            echo "   → El workflow FALLA y el push/merge es BLOQUEADO."
            echo ""
            exit 1
          else
            echo "✅ No se encontraron vulnerabilidades en ${LANGUAGE^^}"
            echo "   → El push/merge puede continuar."
            echo ""
            exit 0
          fi