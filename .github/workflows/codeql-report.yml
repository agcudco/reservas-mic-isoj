name: CodeQL Report

on:
  workflow_run:
    workflows: ["CodeQL Security Analysis"]
    types: [completed]
    branches: [main, develop, master]

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  report:
    name: 📋 Reporte de Vulnerabilidades
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion != 'cancelled' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # ============================================================
      # DESCARGAR artifacts del workflow anterior (el enlace real)
      # ============================================================
      - name: Descargar resultados Java
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: codeql.yml
          run_id: ${{ github.event.workflow_run.id }}
          name: codeql-raw-results-java
          path: ./report-inputs
        continue-on-error: true

      - name: Descargar resultados JavaScript
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: codeql.yml
          run_id: ${{ github.event.workflow_run.id }}
          name: codeql-raw-results-javascript
          path: ./report-inputs
        continue-on-error: true

      - name: Generar reporte Markdown
        id: generate
        env:
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          mkdir -p report-output
          REPORT="report-output/CODEQL_REPORT.md"

          # Encabezado
          cat > "$REPORT" << EOF
          # 🔒 Reporte de Seguridad — CodeQL

          | Propiedad | Valor |
          |-----------|-------|
          | **Workflow origen** | [Análisis #$RUN_ID]($RUN_URL) |
          | **Rama** | \`$BRANCH\` |
          | **Commit** | [\`${SHA:0:7}\`](https://github.com/${{ github.repository }}/commit/$SHA) |
          | **Estado del análisis** | ${{ github.event.workflow_run.conclusion }} |

          ---

          EOF

          TOTAL_GLOBAL=0
          HAS_CRITICAL=false

          for file in ./report-inputs/*-results.json; do
            [ -f "$file" ] || continue

            LANG=$(jq -r '.language' "$file")
            COUNT=$(jq '.alerts | length' "$file")
            TOTAL_GLOBAL=$((TOTAL_GLOBAL + COUNT))

            # Contadores por severidad
            CRIT=$(jq '[.alerts[] | select(.severity == "critical")] | length' "$file")
            HIGH=$(jq '[.alerts[] | select(.severity == "high")] | length' "$file")
            MED=$(jq '[.alerts[] | select(.severity == "medium")] | length' "$file")
            LOW=$(jq '[.alerts[] | select(.severity == "low")] | length' "$file")

            [ "$CRIT" -gt 0 ] && HAS_CRITICAL=true

            # Nombre legible del lenguaje
            if [ "$LANG" == "java" ]; then
              LANG_NAME="☕ Java (Spring Boot)"
            elif [ "$LANG" == "javascript" ]; then
              LANG_NAME="🟨 JavaScript / TypeScript (NestJS)"
            else
              LANG_NAME="$LANG"
            fi

            echo "## $LANG_NAME — $COUNT hallazgo(s)" >> "$REPORT"
            echo "" >> "$REPORT"
            echo "| Severidad | Regla | Descripción | Archivo | Línea |" >> "$REPORT"
            echo "|-----------|-------|-------------|---------|-------|" >> "$REPORT"

            if [ "$COUNT" -gt 0 ]; then
              jq -r '.alerts[] |
                "| " + (.severity | ascii_upcase) +
                " | " + .rule_id +
                " | " + .description +
                " | `" + .path + "`" +
                " | " + (.start_line | tostring) +
                " |"
              ' "$file" >> "$REPORT"
            else
              echo "| — | — | *Sin vulnerabilidades detectadas* | — | — |" >> "$REPORT"
            fi
            echo "" >> "$REPORT"
          done

          # Resumen ejecutivo al inicio (lo insertamos después del encabezado)
          SUMMARY="## 📊 Resumen Ejecutivo

          | Métrica | Valor |
          |---------|-------|
          | **Total hallazgos** | $TOTAL_GLOBAL |
          | 🔴 Críticas | $(jq -s '[.[].alerts[] | select(.severity == "critical")] | length' ./report-inputs/*-results.json 2>/dev/null || echo 0) |
          | 🟠 Altas | $(jq -s '[.[].alerts[] | select(.severity == "high")] | length' ./report-inputs/*-results.json 2>/dev/null || echo 0) |
          | 🟡 Medias | $(jq -s '[.[].alerts[] | select(.severity == "medium")] | length' ./report-inputs/*-results.json 2>/dev/null || echo 0) |
          | 🔵 Bajas | $(jq -s '[.[].alerts[] | select(.severity == "low")] | length' ./report-inputs/*-results.json 2>/dev/null || echo 0) |

          ---

          "

          # Insertar resumen después de la línea 1 del archivo
          { head -n 1 "$REPORT"; echo "$SUMMARY"; tail -n +2 "$REPORT"; } > /tmp/report_final.md
          mv /tmp/report_final.md "$REPORT"

          if [ "$HAS_CRITICAL" = true ]; then
            echo "" >> "$REPORT"
            echo "## ⚠️ Acción Requerida" >> "$REPORT"
            echo "" >> "$REPORT"
            echo "Se detectaron vulnerabilidades **CRÍTICAS**. Corrígelas antes de mergear." >> "$REPORT"
          fi

          cat "$REPORT"

          # Guardar en GITHUB_OUTPUT para el summary
          echo "total=$TOTAL_GLOBAL" >> $GITHUB_OUTPUT
          echo "has_critical=$HAS_CRITICAL" >> $GITHUB_OUTPUT

      - name: Subir reporte como artifact
        uses: actions/upload-artifact@v4
        with:
          name: codeql-security-report
          path: report-output/CODEQL_REPORT.md
          retention-days: 30

      - name: Publicar en GitHub Step Summary
        run: |
          TOTAL=${{ steps.generate.outputs.total }}
          CRIT=${{ steps.generate.outputs.has_critical }}

          echo "## 🔗 Reporte vinculado al Análisis [#${{ github.event.workflow_run.id }}](${{ github.event.workflow_run.html_url }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "$TOTAL" -gt 0 ]; then
            echo "❌ Se encontraron **$TOTAL** vulnerabilidad(es)." >> $GITHUB_STEP_SUMMARY
            if [ "$CRIT" == "true" ]; then
              echo "🔴 **Hay vulnerabilidades CRÍTICAS que requieren atención inmediata.**" >> $GITHUB_STEP_SUMMARY
            fi
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "📄 [Descargar reporte completo](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ **No se detectaron vulnerabilidades.**" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Comentar en PR
        if: ${{ github.event.workflow_run.event == 'pull_request' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER=$(curl -s -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/pulls?head=${{ github.event.workflow_run.head_branch }}&state=open" | \
            jq '.[0].number // empty')

          [ -z "$PR_NUMBER" ] && exit 0

          TOTAL=${{ steps.generate.outputs.total }}
          CONCLUSION="${{ github.event.workflow_run.conclusion }}"

          if [ "$TOTAL" -gt 0 ]; then
            BODY="## 🔒 Resultados CodeQL vinculados

            El análisis de seguridad encontró **$TOTAL vulnerabilidad(es)**.

            | Workflow | Estado |
            |----------|--------|
            | 🔬 Análisis | $CONCLUSION |
            | 📋 Reporte | [Ver detalle](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) |

            > ⚠️ Revisa el artifact \`codeql-security-report\` para el informe completo."
          else
            BODY="## ✅ CodeQL — Sin vulnerabilidades

            El análisis de seguridad no detectó problemas en este cambio.

            | Workflow | Estado |
            |----------|--------|
            | 🔬 Análisis | $CONCLUSION |
            | 📋 Reporte | [Ver detalle](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) |"
          fi

          curl -s -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues/$PR_NUMBER/comments" \
            -d "{\"body\": $(echo "$BODY" | jq -s -R .)}"